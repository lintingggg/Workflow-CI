name: CI Workflow

on:
    push:
        branches:
            - main

jobs:
    build-and-deploy:
        runs-on:
            - ubuntu-latest
        
        steps:
            - name: Run actions/checkout@v3
              uses: actions/checkout@v4
            
            - name: Set up Python 3.12.7
              uses: actions/setup-python@v5
              with:
                python-version: 3.12.7

            - name: Check Env
              run: |
                python --version
                pip --version
            
            - name: Install dependencies
              run: |
                pip install mlflow pandas scikit-learn dagshub

            - name: Run mlflow project
              run: |
                mlflow run MLProject/ --env-manager=local

            - name: Get latest MLflow run_id
              id: get_run_id
              run: |
                RUN_ID=$(ls mlruns/0 | grep -E '^[a-z0-9]+$' | head -n 1)
                echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
                echo "Run ID yang didapat: $RUN_ID"
            
            - name: Install Python dependencies
              run: |
                pip install --upgrade pip

            - name: Upload to GitHub
              uses: actions/upload-artifact@v4
              with:
                name: model-artifacts
                path: mlruns/
            
            - name: Build Docker Model
              run: |
                mlflow models build-docker -m ${{ env.MODEL_DIR }} -n "model-sisrek-film"

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Tag Docker Image
              run: |
                docker tag model-sisrek-film:latest ${{ secrets.DOCKERHUB_USERNAME }}/model-sisrek-film:latest

            - name: Push Docker Image
              run: |  
                docker push ${{ secrets.DOCKERHUB_USERNAME }}/model-sisrek-film:latest
